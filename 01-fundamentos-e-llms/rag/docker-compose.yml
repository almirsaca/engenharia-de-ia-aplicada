# Infraestrutura compartilhada pelos três laboratórios.
#
# Vive aqui, e não dentro de um deles, porque a instância é uma só: o
# titanic-graphrag consulta os nós :Trecho que o embeddings-neo4j grava, e os
# três apontam para bolt://localhost:7687. Cada laboratório sobe o banco com
# `npm run infra:up`, que aponta para este arquivo.
#
# O `name` fixa o nome do projeto Compose. Sem ele o nome viria do diretório, e
# subir de lugares diferentes criaria projetos distintos disputando o mesmo
# `container_name`.
name: rag

services:
  neo4j:
    image: neo4j:5.14.0-community
    container_name: neo4j
    restart: unless-stopped
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/plugins:/plugins
      - ./import:/var/lib/neo4j/import
    ports:
      - "7474:7474"  # Neo4j Browser
      - "7687:7687"  # Bolt Protocol (for queries)
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4JLABS_PLUGINS=["apoc"]
      - NEO4J_apoc_import_file_enabled=true
      # CALL apoc.export.csv.all("/var/lib/neo4j/import/neo4j-export.csv", {})
      # mv /var/lib/neo4j/import/neo4j-export.csv /data/neo4j-export.csv
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
